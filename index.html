<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8086 虚拟实验箱 · 在线运行微机原理课设</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>8086 虚拟实验箱<small>在浏览器里跑课设的汇编</small></h1>
  <div class="toolbar">
    <select id="program-select" title="选择实验程序"></select>
    <button id="btn-run" class="primary">运行</button>
    <button id="btn-step">单步</button>
    <button id="btn-reset">复位</button>
    <label class="speed">
      速度
      <input type="range" id="speed" min="1" max="7" step="1" value="3">
      <span id="speed-label">1×</span>
    </label>
  </div>
</header>

<main>
  <!-- 左：源码 -->
  <section class="pane source-pane">
    <div class="pane-title">
      汇编源码
      <span class="cur-line" id="cur-line">—</span>
    </div>
    <div class="source" id="source"></div>
  </section>

  <!-- 右：实验箱 -->
  <section class="pane board-pane">
    <div class="note" id="program-note" hidden></div>

    <div class="board">
      <div class="board-label">虚拟实验箱</div>

      <div class="board-row">
        <div class="unit">
          <div class="unit-label">七段数码管</div>
          <div class="displays" id="displays"></div>
        </div>
        <div class="unit">
          <div class="unit-label">蜂鸣器</div>
          <div class="buzzer" id="buzzer">
            <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
              <path d="M12 16 L6 16 L6 24 L12 24 L20 30 L20 10 Z" fill="currentColor"/>
              <path id="buzz-wave" d="M24 14 Q29 20 24 26" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" opacity="0"/>
            </svg>
            <span>PB7</span>
          </div>
        </div>
      </div>

      <div class="board-row">
        <div class="unit wide">
          <div class="unit-label" id="keys-label">按键（低电平有效）</div>
          <div class="keys" id="keys"></div>
        </div>
      </div>

      <div class="board-row" id="analog-row" hidden>
        <div class="unit wide">
          <div class="unit-label">模拟输入电压 <b id="analog-val">—</b></div>
          <input type="range" id="analog" min="0" max="255" step="1" value="200">
        </div>
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <h3>通用寄存器</h3>
        <div class="kv" id="regs"></div>
      </div>
      <div class="panel">
        <h3>标志位</h3>
        <div class="kv" id="flags"></div>
      </div>
      <div class="panel">
        <h3>8255 端口</h3>
        <div class="kv" id="ports"></div>
      </div>
    </div>

    <div class="status" id="status">就绪</div>
  </section>
</main>

<footer>
  <p>
    源码取自 <a href="https://github.com/Leslieryin/8086-microcomputer-lab">8086-microcomputer-lab</a>，
    未经改写。CPU 与 8255 / 8253 / 8259 / ADC0808 的行为在浏览器本地仿真，不需要 Proteus。
  </p>
</footer>

<script type="module" src="js/ui.js"></script>
</body>
</html>
